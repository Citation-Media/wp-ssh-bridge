#ddev-generated
# SSH-only upstream pull provider.
#
# Usage:
#   ddev auth ssh
#   ddev pull wp-ssh --environment=WP_SSH_PULL_USER=deploy -y
#
# This provider intentionally omits push commands.

info_command:
  command: |
    echo "${WP_SSH_PULL_USER:-<ssh-user>}@${WP_SSH_PULL_HOST}:${WP_SSH_PULL_REMOTE_PATH}"
  service: web

auth_command:
  command: |
    set -eu -o pipefail
    bash /var/www/html/.ddev/pull/wp-ssh-pull.sh auth
  service: web

db_pull_command:
  command: |
    set -eu -o pipefail
    bash /var/www/html/.ddev/pull/wp-ssh-pull.sh db-pull
  service: web

files_pull_command:
  command: |
    set -eu -o pipefail
    bash /var/www/html/.ddev/pull/wp-ssh-pull.sh files-pull
  service: web

files_import_command:
  command: |
    set -eu -o pipefail
    bash /var/www/html/.ddev/pull/wp-ssh-pull.sh files-import
  service: web

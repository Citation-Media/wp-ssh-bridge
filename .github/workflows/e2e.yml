name: e2e

# Runs e2e/wpsb-e2e against real SSH, WP-CLI, and MariaDB in Docker, and pulls
# into real DDEV and wp-env projects. Only changes that can alter the CLI's
# behaviour or the environment itself trigger it.
on:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "e2e/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "e2e/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [containers, ddev, wp-env]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true

      - name: Set up DDEV
        if: matrix.suite == 'ddev'
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Set up Node
        if: matrix.suite == 'wp-env'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Start the hosts
        run: e2e/wpsb-e2e up

      - name: Run the ${{ matrix.suite }} scenarios
        run: e2e/wpsb-e2e test ${{ matrix.suite }}

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          cp e2e/.state/last-run.log e2e-logs/ 2> /dev/null || true
          docker compose -f e2e/compose.yaml logs --no-color > e2e-logs/compose.log 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.suite }}-logs
          path: e2e-logs/
          if-no-files-found: ignore

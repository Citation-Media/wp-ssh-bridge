name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into manual builds, for example v0.2.0"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

env:
  APP_NAME: ddev-wp-ssh
  GO_VERSION: "1.24.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          mkdir -p dist
          archive="${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}"
          build_flags="-trimpath"
          ldflags="-s -w -X github.com/Citation-Media/ddev-wp-ssh/internal/version.Version=${VERSION} -X github.com/Citation-Media/ddev-wp-ssh/internal/version.Commit=${GITHUB_SHA} -X github.com/Citation-Media/ddev-wp-ssh/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GOOS="${GOOS}" GOARCH="${GOARCH}" go build \
            ${build_flags} \
            -ldflags "${ldflags}" \
            -o "dist/${APP_NAME}" \
            ./cmd/ddev-wp-ssh
          GOOS=linux GOARCH="${GOARCH}" go build \
            -trimpath \
            -ldflags "${ldflags}" \
            -o "dist/${APP_NAME}-container" \
            ./cmd/ddev-wp-ssh
          tar -C dist -czf "dist/${archive}.tar.gz" "${APP_NAME}" "${APP_NAME}-container"
          rm "dist/${APP_NAME}" "dist/${APP_NAME}-container"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_${{ steps.version.outputs.value }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true

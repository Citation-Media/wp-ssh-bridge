name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into manual builds, for example v0.3.4"
        required: true
        default: "v0.3.4"

permissions:
  contents: write

env:
  APP_NAME: wp-ssh-bridge
  GO_VERSION: "1.24.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          mkdir -p dist
          archive="${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}"
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/Citation-Media/wp-ssh-bridge/internal/version.Version=${VERSION} -X github.com/Citation-Media/wp-ssh-bridge/internal/version.Commit=${GITHUB_SHA} -X github.com/Citation-Media/wp-ssh-bridge/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${APP_NAME}" \
            ./cmd/wp-ssh-bridge
          tar -C dist -czf "dist/${archive}.tar.gz" "${APP_NAME}"
          rm "dist/${APP_NAME}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_${{ steps.version.outputs.value }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Each archive is attached twice: under its versioned name, which is what
      # a pinned install asks for, and under a version-free name, which makes
      # github.com/<repo>/releases/latest/download/<name> a permanent link to
      # the newest build. checksums.txt lists both names for the same digest,
      # so `shasum -c --ignore-missing` verifies whichever file was fetched.
      - name: Checksums and permanent-link copies
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          cd dist
          for archive in *.tar.gz; do
            cp "$archive" "$(echo "$archive" | sed "s/_${VERSION}_/_/")"
          done
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true

  # Publishes the npm wrapper. It carries no binary: its postinstall downloads
  # the archive from the release this job runs after, which is why it needs the
  # release to exist first and why its version must equal the tag.
  npm:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: npm
    permissions:
      contents: read
      # Required for npm provenance, which signs the package with a short-lived
      # OIDC token proving it was built from this workflow.
      id-token: write
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          registry-url: https://registry.npmjs.org

      - name: Match the package version to the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          npm version --no-git-tag-version --allow-same-version "${TAG#v}"
          node -e "console.log('publishing', require('./package.json').name, require('./package.json').version)"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Skip the download here: the runner does not need the binary, and the
          # release assets may still be propagating.
          WP_SSH_BRIDGE_SKIP_DOWNLOAD: "1"
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -eu
          # Provenance requires a public repository, so it switches itself on
          # once this one is public instead of failing the release before then.
          if [ "${PRIVATE}" = "true" ]; then
            echo "Repository is private; publishing without provenance."
            npm publish --access public
          else
            npm publish --provenance --access public
          fi


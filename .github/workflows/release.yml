name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into manual builds, for example v0.3.4"
        required: true
        default: "v0.3.4"

permissions:
  contents: write

env:
  APP_NAME: wp-ssh-bridge
  GO_VERSION: "1.24.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          mkdir -p dist
          archive="${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}"
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/Citation-Media/wp-ssh-bridge/internal/version.Version=${VERSION} -X github.com/Citation-Media/wp-ssh-bridge/internal/version.Commit=${GITHUB_SHA} -X github.com/Citation-Media/wp-ssh-bridge/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${APP_NAME}" \
            ./cmd/wp-ssh-bridge
          tar -C dist -czf "dist/${archive}.tar.gz" "${APP_NAME}"
          rm "dist/${APP_NAME}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_${{ steps.version.outputs.value }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Needed for CHANGELOG.md and scripts/release-notes.sh; the tag's own
      # checkout is what makes the notes match the release.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Each archive is attached twice: under its versioned name, which is what
      # a pinned install asks for, and under a version-free name, which makes
      # github.com/<repo>/releases/latest/download/<name> a permanent link to
      # the newest build. checksums.txt lists both names for the same digest,
      # so `shasum -c --ignore-missing` verifies whichever file was fetched.
      - name: Checksums and permanent-link copies
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          cd dist
          for archive in *.tar.gz; do
            cp "$archive" "$(echo "$archive" | sed "s/_${VERSION}_/_/")"
          done
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      # Release notes come from CHANGELOG.md, which is also what the
      # documentation site renders as its changelog. A tag without a section
      # falls back to generated notes rather than publishing an empty release.
      - name: Collect the release notes
        id: notes
        run: |
          set -eu
          if scripts/release-notes.sh "${{ github.ref_name }}" > release-notes.md; then
            echo "GENERATE=false" >> "$GITHUB_OUTPUT"
            echo "Using the CHANGELOG section for ${{ github.ref_name }}:"
            cat release-notes.md
          else
            echo "GENERATE=true" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG section for ${{ github.ref_name }}; falling back to generated notes."
            : > release-notes.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          body_path: ${{ steps.notes.outputs.GENERATE == 'false' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.GENERATE }}
          # A tag with a suffix (v0.7.0-rc.1) is a prerelease. GitHub then keeps
          # "latest" on the last stable release, so releases/latest/download and
          # with it the install script never hand out a release candidate.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Publishes the npm wrapper through npm trusted publishing: the job proves its
  # identity with a short-lived OIDC token instead of a long-lived NPM_TOKEN, and
  # npm attaches provenance on its own. It runs after the GitHub release exists
  # because the package downloads its binary from that release, and its own
  # prepublishOnly refuses to publish a version whose assets are missing.
  #
  # Set this up once at npmjs.com on the package, under Trusted Publishers:
  # organization Citation-Media, repository wp-ssh-bridge, workflow release.yml.
  npm:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # Writing back the version bump, so the repository and the registry agree.
      contents: write
      # Required for trusted publishing.
      id-token: write
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Commit the version bump onto the default branch rather than the tag.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+, which ships with Node 24.
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Resolve the version from the tag
        id: version
        working-directory: .
        run: |
          set -eu
          RAW="${GITHUB_REF#refs/tags/}"
          VERSION="${RAW#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # A prerelease must not move the latest dist-tag.
          if printf '%s' "$VERSION" | grep -qE '-[A-Za-z0-9]'; then
            echo "NPM_TAG=next" >> "$GITHUB_OUTPUT"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the version
        run: npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version --allow-same-version

      - name: Record the version in the repository
        # Only a stable release is written back; a release candidate would put
        # its version into the default branch and the site's changelog.
        if: steps.version.outputs.NPM_TAG == 'latest'
        working-directory: .
        run: |
          set -eu
          printf '%s\n' "${{ steps.version.outputs.VERSION }}" > VERSION
          if git diff --quiet; then
            echo "Version files already match the tag; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION packages/npm/package.json
          git commit -m "Set the version to ${{ steps.version.outputs.VERSION }}"
          git push

      - name: Publish
        # No token: trusted publishing authenticates with the OIDC identity, and
        # npm generates provenance without the --provenance flag.
        run: npm publish --access public --tag "${{ steps.version.outputs.NPM_TAG }}"
